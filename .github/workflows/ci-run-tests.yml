name: Run DRRA tests

on:
  workflow_call:
    inputs:
      branch:
        description: (optional) name of the drra-tests branch to run the tests on
        type: string
        default: 'master'

jobs:
  run-tests:
    runs-on: [modelsim, vesyla, bender, sst]
    steps:
      - name: Clean bin folder
        run: |
          rm -rf ${{ github.workspace }}/bin

      # Use the AppImage built by vesyla's own CI on the branch with the same
      # name (otherwise master), not the latest release, so a branch here is
      # tested against the matching vesyla branch.
      - name: Find vesyla build
        id: vesyla
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/silagokth/vesyla/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # Newest successful run on the branch that still has its AppImage.
          # Filter on conclusion here: the API's status=success filter can miss
          # recent runs and fall back to a months-old build.
          for branch in dict.fromkeys([os.environ["BRANCH"], "master"]):
              runs = api(f"actions/runs?branch={branch}&status=completed&per_page=20")["workflow_runs"]
              for run in runs:
                  if run["conclusion"] != "success":
                      continue
                  for a in api(f"actions/runs/{run['id']}/artifacts")["artifacts"]:
                      if a["name"] == "pkg-artifacts" and not a["expired"]:
                          print(f"Using vesyla@{branch} ({run['head_sha'][:7]}) from {run['html_url']}")
                          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                              out.write(f"artifact_url={a['archive_download_url']}\n")
                          raise SystemExit(0)
              print(f"No successful vesyla build with an AppImage on {branch}")
          raise SystemExit(1)
          PY

      - name: Download vesyla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/bin
          cd ${{ github.workspace }}/bin
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o pkg-artifacts.zip "${{ steps.vesyla.outputs.artifact_url }}"
          python3 -m zipfile -e pkg-artifacts.zip .
          rm pkg-artifacts.zip

      - name: Rename vesyla AppImage
        run: |
          set -e
          file=(${{ github.workspace }}/bin/vesyla-*.AppImage)
          if [ "${#file[@]}" -ne 1 ]; then
            echo "Error: Expected exactly one vesyla-*.AppImage file, found ${#file[@]}"
            exit 1
          fi
          cp "${file[0]}" ${{ github.workspace }}/bin/vesyla

      - name: Download library
        uses: actions/download-artifact@v5
        with:
          name: library

      - name: Extract library
        run: |
          if [ -d "library" ]; then
            rm -rf library
          fi
          tar -xzf library.tar.gz
          rm library.tar.gz

      - name: Checkout testcases
        uses: actions/checkout@v4
        with:
          repository: silagokth/drra-tests
          path: tests
          ref: master
          token: ${{ secrets.DRRA_TEST_PAT }}

      - name: Check if a testing branch with the same name exists
        # The runner reuses tests/ between runs, so local branches and
        # remote-tracking refs can be stale: ask GitHub, and reset to what it has.
        run: |
          cd "${{ github.workspace }}/tests"
          if git ls-remote --exit-code --heads origin "${{ inputs.branch }}" >/dev/null; then
            git fetch origin "${{ inputs.branch }}"
            git checkout --force -B "${{ inputs.branch }}" FETCH_HEAD
            echo "Switching to drra-tests@${{ inputs.branch }} ($(git rev-parse --short HEAD))"
          else
            echo "Using the drra-tests master branch"
          fi

      - name: Run tests
        run: |
          cd "${{ github.workspace }}/tests"
          . /usr/share/modules/init/sh
          module use /opt/modules
          module add questasim 
          module add vesyla
          module add bender
          module add sst
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          chmod +x ${{ github.workspace }}/bin/vesyla
          export VESYLA_SUITE_PATH_COMPONENTS=$(readlink -e ../library)
          export PATH=${{ github.workspace }}/bin:$PATH
          vesyla --version
          vesyla testcase generate -d ./testcases
          ./run.sh

      - name: Tar the tests outputs
        run: tar czf output.tar.gz tests/output

      - name: Upload test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: output.tar.gz
